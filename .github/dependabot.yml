version: 2
updates:
  # Go モジュールの依存更新
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # x/oauth2 は v0.31.0+ が go 1.24 を、v0.36.0+ が go 1.25 を要求し、SDK の最低 Go 1.23
      # （range-over-func）を超えるため、v0.31.0 以降のみ見送る（v0.30.0 までは go 1.23.0 互換）。
      # SDK が go を上げたらこの ignore を外す。
      - dependency-name: "golang.org/x/oauth2"
        versions: [">=0.31.0"]

  # GitHub Actions の更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    ignore:
      # golangci-lint-action v7+ は golangci-lint v2 系で、現行の .golangci.yml(v1 形式) と
      # 非互換。v6 系（golangci-lint v1）を維持するためメジャー更新を無視する。
      - dependency-name: "golangci/golangci-lint-action"
        update-types: ["version-update:semver-major"]
